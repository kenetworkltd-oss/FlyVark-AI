<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | FlyVark AI</title>
    <style>
    body { 
        background: #0a1128; /* Your Official FlyVark Navy */
        color: #ffffff; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0;
        font-family: 'Inter', sans-serif; 
        text-align: center; 
    }
    .box { 
        padding: 50px 30px; 
        background: rgba(255, 255, 255, 0.03);
        /* Using your Electric Blue for a subtle border glow */
        border: 1px solid rgba(0, 210, 255, 0.2); 
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        max-width: 420px;
    }
    h1 { font-size: 2.2rem; margin-bottom: 15px; letter-spacing: -0.02em; }
    p { color: rgba(255, 255, 255, 0.6); line-height: 1.6; margin-bottom: 35px; }
    .btn { 
        background: #00d2ff; /* Your Official Electric Blue */
        color: #0a1128; /* Navy text for high contrast */
        padding: 14px 30px; 
        text-decoration: none; 
        border-radius: 12px; 
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.85rem;
        transition: all 0.3s ease;
        display: inline-block;
    }
    .btn:hover { 
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
    }
</style>
</head>
<body>
    <div class="box">
        <h1>Thank you for booking!</h1>
        <p>We have received your email. Our team will reach out to you within 24 hours to schedule your strategy session.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
